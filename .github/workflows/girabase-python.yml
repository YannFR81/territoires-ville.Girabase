# Girabase — portage Python (dossier girabase-python/) : tests, puis exécutables Windows 10/11.
# Les fichiers produits se téléchargent dans l'onglet « Actions » du dépôt, rubrique « Artifacts ».
# Publication d'une version (onglet « Releases ») avec ces fichiers et les notes de la section X.Y.Z de
# girabase-python/NOUVEAUTES.md : onglet Actions › ce workflow › « Run workflow » en cochant « publier »
# (la version X.Y.Z est celle de girabase-python/pyproject.toml), ou envoi d'une étiquette « python-vX.Y.Z ».
# Les fichiers VB6 d'origine du CEREMA, à la racine du dépôt, ne sont pas concernés.
name: Girabase Python — tests et exécutables Windows

on:
  push:
    branches: ["**"]
    tags: ["python-v*"]
    paths:
      - "girabase-python/**"
      - ".github/workflows/girabase-python.yml"
  pull_request:
    paths:
      - "girabase-python/**"
  workflow_dispatch:
    inputs:
      publier:
        description: "Publier la version de pyproject.toml dans Releases"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: girabase-python
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Dépendances
        # pyproj sert seulement aux tests : contrôle des projections contre PROJ
        run: python -m pip install -r requirements.txt -r requirements-dev.txt pyproj
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Exécutables
        run: |
          pyinstaller --noconfirm --clean girabase.spec
          pyinstaller --noconfirm girabase_fichier_unique.spec
          pyinstaller --noconfirm girabase_mcp.spec
          python outils/creer_mcpb.py dist/girabase-mcp.exe dist/girabase.mcpb
          python outils/guide_pdf.py dist/Guide-utilisateur-Girabase.pdf
          Compress-Archive -Path dist/Girabase -DestinationPath dist/Girabase-Windows.zip -Force
      - name: Auto-contrôle de l'exécutable
        run: |
          $p = Start-Process -FilePath dist/Girabase.exe -ArgumentList "--autotest", "$PWD/autotest" -Wait -PassThru
          Get-Content autotest/autotest_girabase.txt
          if ($p.ExitCode -ne 0) { throw "Auto-contrôle non conforme" }
      - name: Serveur MCP
        run: |
          $init = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}'
          $liste = '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
          $rep = "$init`n$liste`n" | dist/girabase-mcp.exe
          $rep
          if (-not ($rep -match '"calculer_capacite"')) { throw "Serveur MCP sans outils" }
      - uses: actions/upload-artifact@v4
        with:
          name: Girabase-Python-Windows
          path: |
            girabase-python/dist/Girabase.exe
            girabase-python/dist/Girabase-Windows.zip
            girabase-python/dist/girabase-mcp.exe
            girabase-python/dist/girabase.mcpb
            girabase-python/dist/Guide-utilisateur-Girabase.pdf

  publier:
    if: startsWith(github.ref, 'refs/tags/python-v') || (github.event_name == 'workflow_dispatch' && inputs.publier)
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: Girabase-Python-Windows
          path: livraison
      - name: Publier la version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/python-v* ]]; then
            etiquette="$GITHUB_REF_NAME"
          else
            etiquette="python-v$(sed -n 's/^version = "\(.*\)"/\1/p' girabase-python/pyproject.toml)"
          fi
          version="${etiquette#python-v}"
          awk -v v="## $version" '$0 ~ "^## " { garder = (index($0, v) == 1) ; next } garder' \
            girabase-python/NOUVEAUTES.md > notes.md
          {
            echo "Portage Python de **GIRABASE 4** (CERTU/CEREMA) pour Windows 10 et 11, sans installation."
            echo
            echo "| Fichier | Rôle |"
            echo "|---|---|"
            echo "| \`Girabase.exe\` | logiciel complet, fichier unique à copier puis double-cliquer |"
            echo "| \`Girabase-Windows.zip\` | version dossier (démarrage plus rapide ; si l'antivirus bloque le fichier unique) |"
            echo "| \`girabase-mcp.exe\` | serveur MCP pour les assistants d'IA locaux |"
            echo "| \`girabase.mcpb\` | extension Claude Desktop (double-clic) |"
            echo "| \`Guide-utilisateur-Girabase.pdf\` | guide d'utilisation imprimable |"
            echo
            echo "### Nouveautés"
            cat notes.md
            echo
            echo "Contrôle : \`Girabase.exe --autotest C:\\temp\\essai\` recalcule le cas de référence du guide et écrit « CONFORME »."
            echo "Exécutable non signé : au premier lancement, SmartScreen → *Informations complémentaires* → *Exécuter quand même*."
            echo
            echo "Licence GNU GPL v3, comme le code d'origine du CEREMA. Ce portage n'est ni édité ni validé par le CEREMA."
          } > notes_completes.md
          gh release create "$etiquette" livraison/* --target "$GITHUB_SHA" --title "Girabase Python $version" \
            --notes-file notes_completes.md
